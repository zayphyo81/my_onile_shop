<!DOCTYPE html>
< lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Online Shop</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        header {
            background: #111;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin: 0;
        }

        nav {
            background: white;
            padding: 15px;
            text-align: center;
        }

        nav a {
            margin: 10px;
            text-decoration: none;
            color: #111;
        }

        .products {
            padding: 20px;
            text-align: center;
        }

        .product {
            background: white;
            display: inline-block;
            width: 250px;
            margin: 10px;
            padding: 15px;
            border-radius: 10px;
        }

        .product img {
            width: 100%;
            border-radius: 8px;
        }

        .product button {
            background: #111;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
        }
      .order {
  background: white;
  padding: 20px;
  margin: 20px;
  border-radius: 10px;
  text-align: center;
      }
    </style>
</head>

<body>

    <header>
        <h1>My Online Shop</h1>
        <p>Welcome to our shop</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">Contact</a>
    </nav>

    <section class="products">

        <h2>Our Products</h2>

        <div class="product">
            <img src="./product.jpg" alt="Product">
          

            <h3>mlbb dia  </h3>

            <p>25000 Ks</p>

            <button onclick="addToCart()">Add to Cart</button>
        </div>

    </section>
<div id="cart">
  🛒 Cart: 0 items
</div>
</body>
<script>
let cartCount = 0;
  let total = 0;

function addToCart() {
  cartCount++;
  total += 25000;
  document.getElementById("cart").innerHTML =
    "🛒 Cart: " + cartCount + " items - Total: " + (cartCount * 25000) + " Ks";
}
  </script>
<div id="order">
  <h2>Order Now</h2>
  <input type="text" id="name" placeholder="Your Name">
  <input type="text" id="phone" placeholder="Phone Number">
  <textarea id="address" placeholder="Address"></textarea>
  <button onclick="placeOrder()">Place Order</button>
</div>

<script>

const BOT_TOKEN = "";
const CHAT_ID = "7547348074";

async function placeOrder() {
    let name = document.getElementById("name").value.trim();
    let phone = document.getElementById("phone").value.trim();
    let address = document.getElementById("address").value.trim();

    if (name === "" || phone === "" || address === "") {
        alert("Please fill all information");
        return;
    }

    let message =
        "🛒 NEW ORDER\n\n" +
        "👤 Name: " + name + "\n" +
        "📞 Phone: " + phone + "\n" +
        "📍 Address: " + address + "\n\n" +
        "📦 Product: mlbb dia\n" +
        "💰 Price: 25000 Ks";

    try {
        let response = await fetch(
            "https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: message
                })
            }
        );

        let result = await response.json();

        if (result.ok) {
            alert("Order received! Thank you " + name);
          document.getElementById("name").value = "";
document.getElementById("phone").value = "";
document.getElementById("address").value = "";
        } else {
            alert("Order ပို့မရပါ။");
        }

    } catch (error) {
        alert("Connection error");
    }
}
</script>
